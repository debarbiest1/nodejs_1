<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clinic Management System</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }
        header {
            background-color: #333;
            color: white;
            padding: 10px;
            text-align: center;
        }
        section {
            padding: 20px;
            text-align: center;
        }
        footer {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 10px;
            position: fixed;
            bottom: 0;
            width: 100%;
        }
        .hidden {
            display: none;
        }
        button {
            margin: 10px;
            padding: 10px;
            background-color: #333;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background-color: #555;
        }
        .form-container {
            margin: 20px auto;
            width: 600px ;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        input {
            margin: 5px;
            padding: 8px;
            width: calc(100% - 16px);
        }
        #allPatientsContainer {
            text-align: center;
            margin-top: 20px;
        }

        table {
            width: 80%;
            margin: 0 auto;
            border-collapse: collapse;
            background-color: #fff;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        th, td {
            padding: 10px;
            text-align: left;
            border: 1px solid #ddd;
        }

        th {
            background-color: #333;
            color: white;
        }

        tr:nth-child(even) {
            background-color: #f2f2f2;
        }

        tr:hover {
            background-color: #ddd;
        }

        table caption {
            font-size: 1.5em;
            margin-bottom: 10px;
        }

        table td, table th {
            text-align: left;
        }

    </style>
</head>
<body>
    <header>
        <h1>Clinic Management System</h1>
    </header>

    <section>
        <h2>Manage Patients</h2>

        <div>
            <button onclick="showForm('createPatientForm')">Add Patient</button>
            <button onclick="showForm('updatePatientForm')">Update Patient</button>
            <button onclick="showForm('deletePatientForm')">Delete Patient</button>
            <button onclick="showForm('showPatientForm')">Show Patient</button>
            <button onclick="showAllPatients()">Show All Patients</button>
        </div>

        <div id="createPatientForm" class="form-container hidden">
            <h3>Add Patient</h3>
            <form>
                <input type="text" placeholder="Name" id="name" required>
                <input type="number" placeholder="Age" id="age" required>
                <input type="text" placeholder="Gender" id="gender" required>
                <input type="text" placeholder="Contact" id="contact" required>
                <input type="text" placeholder="Address" id="address" required>
                <button type="submit">Submit</button>
            </form>
            <p class="patientDetails"></p>
        </div>

        <div id="updatePatientForm" class="form-container hidden">
            <h3>Update Patient</h3>
            <form>
                <input type="number" placeholder="Patient ID" id="updateId" required>
                <input type="text" placeholder="Name" id="updateName">
                <input type="number" placeholder="Age" id="updateAge">
                <input type="text" placeholder="Gender" id="updateGender">
                <input type="text" placeholder="Contact" id="updateContact">
                <input type="text" placeholder="Address" id="updateAddress">
                <button type="submit">Submit</button>
            </form>
            <p class="patientDetails"></p>
        </div>

        <div id="deletePatientForm" class="form-container hidden">
            <h3>Delete Patient</h3>
            <form>
                <input type="number" placeholder="Patient ID" id="deleteId" required>
                <button type="submit">Submit</button>
            </form>
            <p class="patientDetails"></p>
        </div>

        <div id="showPatientForm" class="form-container hidden">
            <h3>Show Patient</h3>
            <form>
                <input type="number" placeholder="Patient ID" id="showId" required>
                <button type="submit">Submit</button>
            </form>
            <p class="patientDetails"></p>
        </div>
        <div id="allPatientsContainer" class="form-container hidden">
            <h3>All Patients</h3>
            <ul id="allPatientsList"></ul>
        </div>
    </section>

    <footer>
        <p>&copy; 2024 Clinic Management System</p>
    </footer>

    <script>
        function showForm(formId) {
            const forms = document.querySelectorAll('.form-container');
            forms.forEach(form => form.classList.add('hidden'));

            document.getElementById(formId).classList.remove('hidden');
        }
    </script>
</body>
</html>
 <!-- Firebase SDK -->
 <script src="https://www.gstatic.com/firebasejs/9.17.2/firebase-app-compat.js"></script>
 <script src="https://www.gstatic.com/firebasejs/9.17.2/firebase-auth-compat.js"></script>

 <script>



const firebaseConfig = {
            apiKey: "AIzaSyBnCkoejLpSZ9n2CAkeJXZBy6gsgtTcHL4",
            authDomain: "clinicms-40dcc.firebaseapp.com",
            projectId: "clinicms-40dcc",
            storageBucket: "clinicms-40dcc.appspot.com",
            messagingSenderId: "68685621662",
            appId: "1:68685621662:web:e461f62b3e954a95558e8f",
            measurementId: "G-2Y2VHQ4H6R"
        };  
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

document.addEventListener("DOMContentLoaded", async function () {
    const baseUrl = "http://localhost:8080/patients";

    firebase.auth().onAuthStateChanged(async (user) => {
        if (!user) {
            alert("You must log in first!");
            window.location.href = "/";
            return;
        }

        try {
            const token = await user.getIdToken();
            localStorage.setItem("firebaseToken", token);
            console.log("User authenticated:", user.email);
        } catch (error) {
            console.error("Error fetching Firebase Token:", error);
            alert("Session expired. Please log in again.");
            window.location.href = "/";
        }
    });

    async function getAuthToken() {
        const user = firebase.auth().currentUser;
        if (user) {
            return await user.getIdToken();
        }
        return null;
    }

    function showMessage(message, success = true) {
        alert(success ? `✅ ${message}` : `❌ ${message}`);
    }

    function handleResponse(response) {
        return response.json().then((data) => {
            if (response.ok) {
                return data;
            } else {
                throw { code: data.code, message: data.message || "Unknown error" };
            }
        });
    }

    function validatePatientData(patient) {
        if (patient.age <= 0) return "Age must be a positive number";
        if (patient.gender !== "M" && patient.gender !== "F") return "Gender must be 'M' or 'F'";
        if (!patient.name || patient.name.length < 2 || patient.name.length > 25) return "Name must be 2-25 characters";
        if (!patient.contact || !patient.contact.startsWith("+7") || patient.contact.length < 12) return "Contact must start with '+7' and be at least 12 characters long";
        return null;
    }

    function updatePatientDetails(patient) {
        const details = document.getElementsByClassName("patientDetails");
        const patientInfo = `
            <strong>ID:</strong> ${patient.id}<br>
            <strong>Name:</strong> ${patient.name}<br>
            <strong>Age:</strong> ${patient.age}<br>
            <strong>Gender:</strong> ${patient.gender}<br>
            <strong>Contact:</strong> ${patient.contact}<br>
            <strong>Address:</strong> ${patient.address}
        `;

        for (let i = 0; i < details.length; i++) {
            details[i].innerHTML = patientInfo;
        }
    }

    document.getElementById("createPatientForm").addEventListener("submit", async function (e) {
        e.preventDefault();

        const patientData = {
            name: document.getElementById("name").value,
            age: parseInt(document.getElementById("age").value, 10),
            gender: document.getElementById("gender").value,
            contact: document.getElementById("contact").value,
            address: document.getElementById("address").value
        };

        let validationError = validatePatientData(patientData);
        if (validationError) {
            showMessage(validationError, false);
            return;
        }

        const token = await getAuthToken();
        fetch(baseUrl, {
            method: "POST",
            headers: { "Authorization": `Bearer ${token}`, "Content-Type": "application/json" },
            body: JSON.stringify(patientData)
        })
        .then(handleResponse)
        .then((data) => {
            showMessage("Patient created successfully!");
            updatePatientDetails(data.content);
        })
        .catch((error) => showMessage(error.message || "Error creating patient", false));
    });

    document.getElementById("updatePatientForm").addEventListener("submit", async function (e) {
        e.preventDefault();

        const updateId = document.getElementById("updateId").value;
        const patientData = {};

        if (document.getElementById("updateName").value) patientData.name = document.getElementById("updateName").value;
        if (document.getElementById("updateAge").value) patientData.age = parseInt(document.getElementById("updateAge").value, 10);
        if (document.getElementById("updateGender").value) patientData.gender = document.getElementById("updateGender").value;
        if (document.getElementById("updateContact").value) patientData.contact = document.getElementById("updateContact").value;
        if (document.getElementById("updateAddress").value) patientData.address = document.getElementById("updateAddress").value;

        if (Object.keys(patientData).length === 0) {
            showMessage("Please provide at least one field to update", false);
            return;
        }

        const token = await getAuthToken();
        fetch(`${baseUrl}/${updateId}`, {
            method: "PUT",
            headers: { "Authorization": `Bearer ${token}`, "Content-Type": "application/json" },
            body: JSON.stringify(patientData)
        })
        .then(handleResponse)
        .then((data) => {
            showMessage("Patient updated successfully!");
            updatePatientDetails(data.content);
        })
        .catch((error) => showMessage(error.message || "Error updating patient", false));
    });

    document.getElementById("deletePatientForm").addEventListener("submit", async function (e) {
        e.preventDefault();

        const deleteId = document.getElementById("deleteId").value;
        const token = await getAuthToken();

        fetch(`${baseUrl}/${deleteId}`, {
            method: "DELETE",
            headers: { "Authorization": `Bearer ${token}`, "Content-Type": "application/json" }
        })
        .then(handleResponse)
        .then((data) => showMessage("Patient deleted successfully!"))
        .catch((error) => showMessage(error.message || "Error deleting patient", false));
    });

    function showAllPatients() {
        fetchPatients();
    }

    async function fetchPatients() {
        const token = await getAuthToken();
        console.log("🔥 Firebase Token Sent to Backend:", token); 

        if (!token) {
            alert("You must be logged in to access this page.");
            window.location.href = "/";
            return;
        }
        
        fetch(baseUrl, {
            method: "GET",
            headers: { "Authorization": `Bearer ${token}`, "Content-Type": "application/json" }
        })
        .then(handleResponse)
        .then((data) => {
            const allPatientsContainer = document.getElementById("allPatientsContainer");
            const allPatientsList = document.getElementById("allPatientsList");
            allPatientsList.innerHTML = "";

            let table = `<table><thead><tr><th>ID</th><th>Name</th><th>Age</th><th>Gender</th><th>Contact</th><th>Address</th></tr></thead><tbody>`;
            data.content.forEach(patient => {
                table += `<tr><td>${patient.id}</td><td>${patient.name}</td><td>${patient.age}</td><td>${patient.gender}</td><td>${patient.contact}</td><td>${patient.address}</td></tr>`;
            });
            table += `</tbody></table>`;

            allPatientsList.innerHTML = table;
            allPatientsContainer.classList.remove('hidden');
        })
        .catch((error) => showMessage(error.message || "Error fetching patients", false));
    }
    
    function logout() {
        firebase.auth().signOut().then(() => {
            localStorage.removeItem("firebaseToken");
            alert("Logged out successfully!");
            window.location.href = "/";
        }).catch((error) => console.error("Logout Error:", error));
    }
});
</script>
